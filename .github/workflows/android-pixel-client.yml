name: Android Pixel Client

concurrency:
  group: android-pixel-client-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feature/android-pixel-client-v1
    paths:
      - "android/**"
      - "src/**"
      - "tests/**"
      - "content/**"
      - ".github/workflows/android-pixel-client.yml"
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "tests/**"
      - "content/**"
      - ".github/workflows/android-pixel-client.yml"
  workflow_dispatch:

jobs:
  python-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run complete Python suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v

  android-unit-and-assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Run Android unit tests
        run: gradle -p android testDebugUnitTest --stacktrace

      - name: Compile Compose instrumentation tests
        run: gradle -p android :app:assembleDebugAndroidTest --stacktrace

      - name: Assemble debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Verify APK contents and hash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          sha256sum "$APK" | tee android-apk-sha256.txt
          unzip -l "$APK" > android-apk-contents.txt
          grep -q "lib/arm64-v8a/" android-apk-contents.txt
          grep -q "lib/armeabi-v7a/" android-apk-contents.txt
          grep -q "lib/x86_64/" android-apk-contents.txt
          grep -q "vertical_slice_01.json" android-apk-contents.txt

      - name: Upload debug APK for delivery and manual workflow runs
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: THE-GAME-Android-Pixel-Client-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-apk-sha256.txt
            android-apk-contents.txt
          if-no-files-found: error
          retention-days: 1

  android-emulator-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[emulator]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run pixel shell and real boot smoke tests
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: |
            gradle -p android connectedDebugAndroidTest --stacktrace

      - name: Verify collected UI screenshot set
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import struct
          root = Path('android/app/build/outputs/connected_android_test_additional_output')
          files = sorted(root.rglob('*.png'))
          expected = {'character-320dp.png', 'equipment-jacket-detail.png', 'map-gate-twelve-320dp.png', 'relay-workbench-320dp.png', 'stats-320dp.png', 'stats-perception-detail.png', 'story-scene-first-320dp.png'}
          assert len(files) == len(expected) and {file.name for file in files} == expected, f'Missing UI evidence: {[str(file) for file in files]}'
          for file in files:
              content = file.read_bytes()
              assert content[:8] == b'\x89PNG\r\n\x1a\n' and content[12:16] == b'IHDR', f'Invalid PNG: {file}'
              width, height = struct.unpack('>II', content[16:24])
              assert width > 0 and height > 0, f'Empty PNG: {file}'
              print(f'{file.name}: {width}x{height}; SHA-256 {hashlib.sha256(content).hexdigest()}')
          PY

      - name: Upload small UI verification screenshots
        uses: actions/upload-artifact@v4
        with:
          name: THE-GAME-UI-QA-${{ github.run_id }}
          path: android/app/build/outputs/connected_android_test_additional_output/**/*.png
          if-no-files-found: error
          retention-days: 1
