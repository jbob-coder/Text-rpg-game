name: Android APK Artifact

on:
  push:
    branches:
      - integration/android-open-world-v1-reconcile
    paths:
      - ".github/workflows/android-apk-artifact.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-verified-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Prove runtime sources unchanged from verified parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ebb84cdf4d6ec19ae8e3f9ce1de3d8fdc8942380"
          git diff --exit-code HEAD^ HEAD -- android src tests content
          printf '%s\n' "VERIFIED_RUNTIME_PARENT=ebb84cdf4d6ec19ae8e3f9ce1de3d8fdc8942380" | tee artifact-source.txt
          printf '%s\n' "ARTIFACT_COMMIT=$(git rev-parse HEAD)" | tee -a artifact-source.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Assemble debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Verify APK payload and record SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          sha256sum "$APK" | tee android-apk-sha256.txt
          unzip -l "$APK" > android-apk-contents.txt
          grep -q "lib/arm64-v8a/" android-apk-contents.txt
          grep -q "lib/armeabi-v7a/" android-apk-contents.txt
          grep -q "lib/x86_64/" android-apk-contents.txt
          grep -q "vertical_slice_01.json" android-apk-contents.txt

      - name: Upload exact-runtime APK
        uses: actions/upload-artifact@v4
        with:
          name: THE-GAME-Android-ebb84cdf
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-apk-sha256.txt
            android-apk-contents.txt
            artifact-source.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
